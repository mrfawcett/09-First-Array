name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: "HorseBarn.findHorseSpace (20)"
        id: findhorsespace
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "HorseBarn.findHorseSpace"
          setup-command: ''
          command: sh .github/grade.sh FindHorseSpaceTest
          timeout: 5
          max-score: 20
      - name: "HorseBarn.consolidate (30)"
        id: consolidate
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "HorseBarn.consolidate"
          setup-command: ''
          command: sh .github/grade.sh ConsolidateTest
          timeout: 5
          max-score: 30
      - name: "Mountain.getPeakIndex (25)"
        id: getpeakindex
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Mountain.getPeakIndex"
          setup-command: ''
          command: sh .github/grade.sh GetPeakIndexTest
          timeout: 5
          max-score: 25
      - name: "Mountain.isMountain (25)"
        id: ismountain
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Mountain.isMountain"
          setup-command: ''
          command: sh .github/grade.sh IsMountainTest
          timeout: 5
          max-score: 25
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          FINDHORSESPACE_RESULTS: "${{ steps.findhorsespace.outputs.result }}"
          CONSOLIDATE_RESULTS: "${{ steps.consolidate.outputs.result }}"
          GETPEAKINDEX_RESULTS: "${{ steps.getpeakindex.outputs.result }}"
          ISMOUNTAIN_RESULTS: "${{ steps.ismountain.outputs.result }}"
        with:
          runners: findhorsespace,consolidate,getpeakindex,ismountain

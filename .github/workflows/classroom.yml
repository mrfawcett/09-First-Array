name: Autograding Tests
'on':
  - push
  - workflow_dispatch
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integrity check - tests, pom.xml and grading.json must be unchanged
        run: |
          EXPECTED="31fc92c00759a4319580a22ef4f62538d63c4c0da235912701b2db6cc39bf455"
          ACTUAL=$( (for f in $(find src/test/java -type f -name '*.java' | LC_ALL=C sort) pom.xml grading.json; do sed 's/\r$//' "$f"; done) | sha256sum | cut -d' ' -f1)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The test files, pom.xml, or grading.json in this repository differ from the assignment template. Grading has been stopped. Restore the original files (git checkout origin/main -- src/test pom.xml grading.json) and push again."
            exit 1
          fi
          echo "Integrity check passed."
      - name: "HorseBarn.findHorseSpace (20)"
        id: findhorsespace
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "HorseBarn.findHorseSpace"
          setup-command: ''
          command: mvn -B -q test -Dtest=FindHorseSpaceTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 20
      - name: "HorseBarn.consolidate (30)"
        id: consolidate
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "HorseBarn.consolidate"
          setup-command: ''
          command: mvn -B -q test -Dtest=ConsolidateTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 30
      - name: "Mountain.getPeakIndex (25)"
        id: getpeakindex
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Mountain.getPeakIndex"
          setup-command: ''
          command: mvn -B -q test -Dtest=GetPeakIndexTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 25
      - name: "Mountain.isMountain (25)"
        id: ismountain
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: "Mountain.isMountain"
          setup-command: ''
          command: mvn -B -q test -Dtest=IsMountainTest -Dsurefire.failIfNoSpecifiedTests=false
          timeout: 5
          max-score: 25
      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          FINDHORSESPACE_RESULTS: "${{ steps.findhorsespace.outputs.result }}"
          CONSOLIDATE_RESULTS: "${{ steps.consolidate.outputs.result }}"
          GETPEAKINDEX_RESULTS: "${{ steps.getpeakindex.outputs.result }}"
          ISMOUNTAIN_RESULTS: "${{ steps.ismountain.outputs.result }}"
        with:
          runners: findhorsespace,consolidate,getpeakindex,ismountain
